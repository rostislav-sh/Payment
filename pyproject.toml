[project]
name = "payment"
version = "0.1.0"
description = "Async payment processing service: FastAPI + Outbox + RabbitMQ (FastStream)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143,<0.144",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "faststream[rabbit]>=0.7.7,<0.8",
    "httpx>=0.28",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers"]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: tests that need Docker (testcontainers)",
]
